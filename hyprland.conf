# =====================================================================
#  hyprland.conf  -  a small, beginner-friendly starter config
#  Goes in:  ~/.config/hypr/hyprland.conf
#  Hyprland reloads it automatically every time you save the file.
#  Format is always:   name = value      (lines starting with # are comments)
# =====================================================================

# ---- Screen -----------------------------------------------------------
# monitor = name, resolution, position, scale
# ",preferred,auto,1" means: any screen, its best resolution, scale 1
monitor = , preferred, auto, 1

# ---- Programs I use ---------------------------------------------------
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun
$browser = vivaldi
$mod = SUPER                # the Windows key

# ---- Start these when Hyprland starts --------------------------------
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = nm-applet --indicator
exec-once = systemctl --user start hyprpolkitagent

# ---- Keyboard / touchpad ---------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

# ---- Looks -------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 8
}

misc {
    disable_hyprland_logo = true
}

# ---- Keybindings -------------------------------------------------------
# bind = MODIFIER, key, action, extra
bind = $mod, Return, exec, $terminal          # open terminal
bind = $mod, D, exec, $menu                   # app launcher
bind = $mod, E, exec, $fileManager            # file manager
bind = $mod, B, exec, $browser                # browser
bind = $mod, Q, killactive                    # close window
bind = $mod SHIFT, E, exit                    # log out of Hyprland
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, L, exec, hyprlock                # lock screen

# Move focus with arrow keys
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Workspaces: Super+1..5 switch, Super+Shift+1..5 move the window there
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Move / resize windows with the mouse (hold Super + drag)
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshot: select an area, it goes to the clipboard
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy

# Volume, brightness and media keys (bindel = repeats while held)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
